<svg xmlns="http://www.w3.org/2000/svg" width="180.000000mm" height="176.210526mm" viewBox="0 0 1900 1860"><defs><marker id="arrow_5f6b76" markerWidth="10.0" markerHeight="8.0" refX="9.5" refY="4.0" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8.0 L10.0,4.0 z" fill="#5F6B76" /></marker><marker id="arrow_4b7eaf" markerWidth="10.0" markerHeight="8.0" refX="9.5" refY="4.0" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8.0 L10.0,4.0 z" fill="#4B7EAF" /></marker><marker id="arrow_5a9b55" markerWidth="10.0" markerHeight="8.0" refX="9.5" refY="4.0" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8.0 L10.0,4.0 z" fill="#5A9B55" /></marker></defs><rect x="0" y="0" width="1900" height="1860" fill="#FFFFFF" /><polyline points="950,350 950,395" fill="none" stroke="#5F6B76" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="E_INPUT_STEM" /><polyline points="350,395 1550,395" fill="none" stroke="#5F6B76" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="E_INPUT_DIST" /><polyline points="350,395 350,440" fill="none" stroke="#5F6B76" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="E_TO_IDENTITY" marker-end="url(#arrow_5f6b76)" /><polyline points="950,395 950,440" fill="none" stroke="#5F6B76" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="E_TO_COMPARATOR" marker-end="url(#arrow_5f6b76)" /><polyline points="1550,395 1550,440" fill="none" stroke="#5F6B76" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="E_TO_UNIT" marker-end="url(#arrow_5f6b76)" /><polyline points="350,670 350,730" fill="none" stroke="#7A8590" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="E_IDENTITY_DOWN" /><polyline points="950,670 950,730" fill="none" stroke="#7A8590" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="E_COMPARATOR_DOWN" /><polyline points="1550,670 1550,730" fill="none" stroke="#7A8590" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="E_UNIT_DOWN" /><polyline points="350,730 1550,730" fill="none" stroke="#7A8590" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="E_INTEGRITY_DIST" /><polyline points="520,730 520,810" fill="none" stroke="#4B7EAF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="E_TO_BULK" marker-end="url(#arrow_4b7eaf)" /><polyline points="1380,730 1380,810" fill="none" stroke="#5A9B55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="E_TO_SC" marker-end="url(#arrow_5a9b55)" /><polyline points="520,1160 520,1220 950,1220" fill="none" stroke="#4B7EAF" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="E_BULK_CONVERGE" /><polyline points="1380,1160 1380,1220 950,1220" fill="none" stroke="#5A9B55" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="E_SC_CONVERGE" /><polyline points="950,1220 950,1290" fill="none" stroke="#5F6B76" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="E_TO_SYNTHESIS" marker-end="url(#arrow_5f6b76)" /><polyline points="950,1480 950,1630" fill="none" stroke="#7D858D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="E_TO_BOUNDARY" stroke-dasharray="8 8" /><rect x="80" y="60" width="1740" height="290" rx="18" ry="18" fill="#F7F8F8" stroke="#8793A0" stroke-width="2.4" id="N_INPUT" /><text x="114.0" y="118.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32.0" font-weight="700" fill="#27323C" id="N_INPUT_title"><tspan x="114.0" dy="0">Six public human DFU transcriptomic series</tspan></text><text x="114.0" y="168.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="400" fill="#27323C" id="N_INPUT_body"><tspan x="114.0" dy="0">127 accession records mapped to 94 analytic participant units</tspan><tspan x="114.0" dy="33.04">Core bulk: GSE80178 | exact-reuse audit: GSE68183</tspan><tspan x="114.0" dy="33.04">Supporting single-cell context: GSE165816</tspan><tspan x="114.0" dy="33.04">Non-core context: GSE134431 (healing), GSE143735 (forearm),</tspan><tspan x="114.0" dy="33.04">GSE199939 (foot-skin background)</tspan></text><rect x="80" y="440" width="540" height="230" rx="18" ry="18" fill="#EDF4FB" stroke="#4B7EAF" stroke-width="2.4" id="N_IDENTITY" /><text x="114.0" y="498.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32.0" font-weight="700" fill="#27323C" id="N_IDENTITY_title"><tspan x="114.0" dy="0">Source-object identity</tspan></text><text x="114.0" y="548.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="400" fill="#27323C" id="N_IDENTITY_body"><tspan x="114.0" dy="0">Six GSE68183 controls exactly</tspan><tspan x="114.0" dy="33.04">matched GSE80178 raw objects</tspan><tspan x="114.0" dy="33.04">Duplicate labels remained</tspan><tspan x="114.0" dy="33.04">provenance, not added evidence</tspan></text><rect x="680" y="440" width="540" height="230" rx="18" ry="18" fill="#EDF4FB" stroke="#4B7EAF" stroke-width="2.4" id="N_COMPARATOR" /><text x="714.0" y="498.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32.0" font-weight="700" fill="#27323C" id="N_COMPARATOR_title"><tspan x="714.0" dy="0">Comparator roles</tspan></text><text x="714.0" y="548.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="400" fill="#27323C" id="N_COMPARATOR_body"><tspan x="714.0" dy="0">DFU, diabetic intact foot, and</tspan><tspan x="714.0" dy="33.04">nondiabetic intact foot skin</tspan><tspan x="714.0" dy="33.04">remained distinct strata</tspan><tspan x="714.0" dy="33.04">Other contexts stayed outside</tspan></text><rect x="1280" y="440" width="540" height="230" rx="18" ry="18" fill="#EDF4FB" stroke="#4B7EAF" stroke-width="2.4" id="N_UNIT" /><text x="1314.0" y="498.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32.0" font-weight="700" fill="#27323C" id="N_UNIT_title"><tspan x="1314.0" dy="0">Participant-level units</tspan></text><text x="1314.0" y="548.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="400" fill="#27323C" id="N_UNIT_body"><tspan x="1314.0" dy="0">Participants were the clinical</tspan><tspan x="1314.0" dy="33.04">inferential units</tspan><tspan x="1314.0" dy="33.04">Cells, libraries, and reused</tspan><tspan x="1314.0" dy="33.04">objects were not independent n</tspan></text><rect x="140" y="810" width="760" height="350" rx="18" ry="18" fill="#EDF4FB" stroke="#4B7EAF" stroke-width="2.4" id="N_BULK" /><text x="174.0" y="868.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32.0" font-weight="700" fill="#27323C" id="N_BULK_title"><tspan x="174.0" dy="0">Core bulk inference</tspan></text><text x="174.0" y="918.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="400" fill="#27323C" id="N_BULK_body"><tspan x="174.0" dy="0">GSE80178: 12 arrays</tspan><tspan x="174.0" dy="33.04">6 DFU, 3 diabetic intact foot,</tspan><tspan x="174.0" dy="33.04">3 nondiabetic intact foot</tspan><tspan x="174.0" dy="33.04">RMA plus limma; prespecified contrasts</tspan><tspan x="174.0" dy="33.04">Robustness required at least 2</tspan><tspan x="174.0" dy="33.04">independent compatible studies</tspan></text><rect x="1000" y="810" width="760" height="350" rx="18" ry="18" fill="#F1F7F0" stroke="#5A9B55" stroke-width="2.4" id="N_SC" /><text x="1034.0" y="868.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32.0" font-weight="700" fill="#27323C" id="N_SC_title"><tspan x="1034.0" dy="0">Supporting single-cell context</tspan></text><text x="1034.0" y="918.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="400" fill="#27323C" id="N_SC_body"><tspan x="1034.0" dy="0">GSE165816: foot skin only</tspan><tspan x="1034.0" dy="33.04">14 libraries from 11 participants</tspan><tspan x="1034.0" dy="33.04">7 healers and 4 nonhealers</tspan><tspan x="1034.0" dy="33.04">Outcome-blinded cell annotation</tspan><tspan x="1034.0" dy="33.04">Participant-cell-type pseudobulk</tspan><tspan x="1034.0" dy="33.04">One global BH correction</tspan></text><rect x="260" y="1290" width="1380" height="190" rx="18" ry="18" fill="#F4F7F4" stroke="#6E7F73" stroke-width="2.4" id="N_SYNTHESIS" /><text x="294.0" y="1348.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32.0" font-weight="700" fill="#27323C" id="N_SYNTHESIS_title"><tspan x="294.0" dy="0">Provenance-aware evidence assessment</tspan></text><text x="294.0" y="1398.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="400" fill="#27323C" id="N_SYNTHESIS_body"><tspan x="294.0" dy="0">One independent compatible core bulk study remained</tspan><tspan x="294.0" dy="33.04">Single-cell outcome testing supplied participant-level context</tspan><tspan x="294.0" dy="33.04">Cross-study robustness and supporting evidence remained distinct</tspan></text><rect x="310" y="1630" width="1280" height="170" rx="18" ry="18" fill="#FAFAF9" stroke="#7D858D" stroke-width="1.8" id="N_BOUNDARY" /><text x="344.0" y="1688.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32.0" font-weight="700" fill="#27323C" id="N_BOUNDARY_title"><tspan x="344.0" dy="0">Interpretation boundary</tspan></text><text x="344.0" y="1738.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="400" fill="#27323C" id="N_BOUNDARY_body"><tspan x="344.0" dy="0">No cross-study gene or pathway robustness claim was estimable</tspan><tspan x="344.0" dy="33.04">Global null evidence does not establish biological absence or replication</tspan></text></svg>